packages:
  - packages/*
  - apps/*

# pnpm 11 blocks dependency build scripts unless listed here.
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  # Grammar packages ship prebuilt .wasm files; the native node-gyp build is not needed.
  tree-sitter-java: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-typescript: false
