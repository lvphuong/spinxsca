id: 109-correct-sibling-baseline-spring
title: One account operation lacks the @PreAuthorize its siblings carry (Spring)
description: >-
  get, update and export are annotated with @PreAuthorize("#id == principal.id"); close is not, so
  any authenticated user can delete any account. Reference case for annotation-based controls and
  the baseline-correct reference.
