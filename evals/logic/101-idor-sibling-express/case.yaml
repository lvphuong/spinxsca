id: 101-idor-sibling-express
title: Sibling route updates an order by id alone (Express, Sequelize)
description: >-
  GET /orders/:id scopes the lookup to the owner (baseline-correct reference); PUT /orders/:id updates
  by id alone, so any authenticated user can change any order. Reference case for baseline diffing
  and the resource × operation census (ADR-049).
