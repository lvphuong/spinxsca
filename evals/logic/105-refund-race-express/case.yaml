id: 105-refund-race-express
title: Refund check-then-act without a transaction (Express)
description: >-
  The balance is read, compared and written in application code with no transaction, lock or
  conditional update; two concurrent refunds both pass the check. Needs a real model (live_only):
  the scripted provider cannot reason about concurrency.
